repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^frontend/
  - repo: local
    hooks:
      - id: workflow-lint
        name: workflow-lint
        entry: python scripts/lint_workflows.py
        language: system
        pass_filenames: false
        files: ^\.github/
