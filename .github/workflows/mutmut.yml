name: Mutation Testing

on:
  workflow_dispatch:
  push:
    branches: [main, master, "phase*"]
    paths:
      - "services/pricing_engine.py"
      - "services/payment_service.py"
      - "services/attendance_service.py"
      - "api/auth.py"
      - "services/licence_service.py"

permissions:
  contents: write

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install mutmut pytest hypothesis cryptography
      - name: Run mutmut (bounded)
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: mutmut-secret-not-for-prod-32xx
          COHORTOS_AUTH_DB: /tmp/mutmut-auth.db
          COHORTOS_CLOUD_DB: /tmp/mutmut-cloud.db
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
        run: |
          set +e
          bash scripts/run_mutmut.sh
          RC=$?
          set -e
          test -f /tmp/mutmut-report.json || echo '{"mutation_score_pct":0,"pass":false,"error":"no report"}' > /tmp/mutmut-report.json
          cat /tmp/mutmut-report.json
          tail -n 200 /tmp/mutmut-full.log || true
          echo "## mutmut" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 /tmp/mutmut-full.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; d=json.load(open('/tmp/mutmut-report.json')); print(d); raise SystemExit(0 if d.get('pass') else 1)"
      - name: Diag mutmut always
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_write_diag.py diag-mutmut || true
          OUT="diag-mutmut-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-mutmut.json /tmp/$OUT 2>/dev/null || cp /tmp/mutmut-report.json /tmp/$OUT 2>/dev/null || echo '{"error":"no diag"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="mutmut-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/mutmut-report.json /tmp/$OUT 2>/dev/null || echo '{"pass":false}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT
