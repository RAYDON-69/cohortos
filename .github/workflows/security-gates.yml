name: Security and License Gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  licenses-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps + license tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses pip-audit
      - name: pip license gate
        run: |
          pip-licenses --format=json --output-file /tmp/pip-licenses.json || true
          python scripts/license_gate.py --pip-json /tmp/pip-licenses.json --allowlist docs/LICENSE_ALLOWLIST.txt
      - name: pip-audit high
        run: |
          set +e
          pip-audit -r requirements.txt --format json -o /tmp/pip-audit.json
          set -e
          python scripts/pip_audit_gate.py --json /tmp/pip-audit.json --allowlist docs/PIP_AUDIT_ALLOWLIST.txt
      - name: npm install + production audit
        working-directory: frontend
        run: |
          npm install
          set +e
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit-prod.json
          npm audit --audit-level=high --json > /tmp/npm-audit-all.json
          set -e
          python ../scripts/npm_audit_gate.py --json /tmp/npm-audit-prod.json --dev-json /tmp/npm-audit-all.json
          npm audit fix --omit=dev || true
      - name: Publish licenses-audit signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="security-licenses-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python3 -c "import json,pathlib,datetime; doc={'job':'licenses-and-audit','run_id':'${{ github.run_id }}','sha':'${{ github.sha }}'};
pathlib.Path('/tmp/$OUT').write_text(json.dumps(doc,indent=2))"
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  headers-and-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          cd frontend && npm install
      - name: Start API (limiter ON)
        env:
          COHORTOS_JWT_SECRET: e2e-test-secret-not-for-prod
          COHORTOS_FOUNDER_TOKEN: e2e-founder-token-not-for-prod
          COHORTOS_AUTH_DB: /tmp/sec-auth.db
          COHORTOS_CLOUD_DB: /tmp/sec-cloud.db
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
        run: |
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8741/health >/dev/null; then echo API up; exit 0; fi
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then echo API died; cat /tmp/api.log; exit 1; fi
            sleep 1
          done
          echo API failed; cat /tmp/api.log; exit 1
      - name: Rate-limit auth/OTP
        run: python scripts/rate_limit_probe.py --base http://127.0.0.1:8741 --out /tmp/rate-limit-report.json
      - name: Headers probe
        working-directory: frontend
        run: |
          npx vite --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          python ../scripts/security_headers_probe.py --url http://127.0.0.1:5173/
      - name: Publish rate-limit signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="security-ratelimit-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/rate-limit-report.json /tmp/$OUT 2>/dev/null || echo '{"error":"no report"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  bandit-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit medium+
        run: |
          pip install bandit
          bandit -r services api -ll -f json -o /tmp/bandit.json
          bandit -r services api -ll
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/python --config=p/owasp-top-ten --error || true
      - name: Publish bandit signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="security-bandit-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/bandit.json /tmp/$OUT 2>/dev/null || echo '{}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  auth-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt && pip install pytest httpx
      - name: Run matrix
        env:
          COHORTOS_JWT_SECRET: matrix-test-secret-not-for-prod-32chars
          COHORTOS_FOUNDER_TOKEN: founder-matrix-token
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
        run: pytest tests/test_auth_matrix.py tests/test_security_sweep.py tests/test_rate_limit.py -q --tb=short | tee /tmp/auth-matrix.txt
      - name: Publish auth-matrix signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="security-authmatrix-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python3 -c "import json,pathlib,datetime; t=pathlib.Path('/tmp/auth-matrix.txt').read_text(errors='ignore') if pathlib.Path('/tmp/auth-matrix.txt').exists() else ''; pathlib.Path('/tmp/$OUT').write_text(json.dumps({'log_tail':t[-4000:],'generated_at':datetime.datetime.utcnow().isoformat()+'Z'},indent=2))"
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt schemathesis hypothesis
      - name: Start API
        env:
          COHORTOS_JWT_SECRET: fuzz-secret-not-for-prod-32charsxx
          COHORTOS_FOUNDER_TOKEN: founder-fuzz
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
        run: |
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8741/health && break; sleep 1; done
      - name: Fuzz health + openapi no 5xx
        run: |
          schemathesis run http://127.0.0.1:8741/openapi.json -i /health --checks not_a_server_error --hypothesis-max-examples=50
      - name: Publish fuzz signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="security-fuzz-${{ github.run_id }}-${{ github.run_attempt }}.json"
          echo '{"status":"ran"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT
