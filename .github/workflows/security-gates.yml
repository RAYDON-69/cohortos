name: Security and License Gates

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  licenses-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses pip-audit
      - name: pip license gate
        run: |
          set -euo pipefail
          pip-licenses --format=json --output-file /tmp/pip-licenses.json
          python scripts/license_gate.py --pip-json /tmp/pip-licenses.json --allowlist docs/LICENSE_ALLOWLIST.txt
      - name: pip-audit high
        run: |
          set -euo pipefail
          pip-audit -r requirements.txt --format json -o /tmp/pip-audit.json || true
          python scripts/pip_audit_gate.py --json /tmp/pip-audit.json --allowlist docs/PIP_AUDIT_ALLOWLIST.txt
      - name: npm install + production audit
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit-prod.json || true
          npm audit --audit-level=high --json > /tmp/npm-audit-all.json || true
          python ../scripts/npm_audit_gate.py --json /tmp/npm-audit-prod.json --dev-json /tmp/npm-audit-all.json
      - name: Build audit signal JSON
        if: always()
        run: |
          set -euo pipefail
          python scripts/ci_build_audit_signal.py
      - name: Publish signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="security-licenses-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/audit-signal.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  headers-and-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          cd frontend && npm install
      - name: Start API (limiter ON)
        env:
          COHORTOS_JWT_SECRET: e2e-test-secret-not-for-prod
          COHORTOS_FOUNDER_TOKEN: e2e-founder-token-not-for-prod
          COHORTOS_AUTH_DB: /tmp/sec-auth.db
          COHORTOS_CLOUD_DB: /tmp/sec-cloud.db
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
        run: |
          set -euo pipefail
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8741/health >/dev/null; then echo API up; exit 0; fi
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then echo API died; cat /tmp/api.log; exit 1; fi
            sleep 1
          done
          echo API failed; cat /tmp/api.log; exit 1
      - name: Rate-limit auth/OTP
        run: |
          set -euo pipefail
          python scripts/rate_limit_probe.py --base http://127.0.0.1:8741 --out /tmp/rate-limit-report.json
      - name: Headers probe
        working-directory: frontend
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          python ../scripts/security_headers_probe.py --url http://127.0.0.1:5173/
      - name: Publish rate-limit signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="security-ratelimit-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/rate-limit-report.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  bandit-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Bandit medium+
        run: |
          set -euo pipefail
          pip install bandit
          bandit -r services api -ll -f json -o /tmp/bandit.json || true
          python scripts/ci_write_bandit_report.py /tmp/bandit.json /tmp/bandit-report.json
          echo "## Bandit findings" >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci_bandit_summary.py /tmp/bandit.json
          cat /tmp/bandit_summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          bandit -r services api -ll
      - name: Diag bandit always
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_write_diag.py diag-bandit-semgrep || true
          OUT="diag-bandit-semgrep-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-bandit-semgrep.json /tmp/$OUT 2>/dev/null || echo '{"error":"no diag"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
      - name: Semgrep
        run: |
          set -euo pipefail
          pip install semgrep
          semgrep --config=p/python --config=p/owasp-top-ten --json -o /tmp/semgrep.json || true
          python scripts/ci_write_semgrep_report.py /tmp/semgrep.json /tmp/semgrep-report.json
          # soft until noise tuned; fail only on ERROR severity if present
          python scripts/ci_semgrep_gate.py /tmp/semgrep.json
          cat /tmp/semgrep_summary.txt >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
      - name: Diag semgrep always
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_write_diag.py diag-semgrep || true
          python - <<'PY'
          import json, pathlib
          sp = pathlib.Path("/tmp/semgrep.json")
          data = json.loads(sp.read_text()) if sp.exists() else {}
          doc = {"schema":"cohortos.ci-report/v1","kind":"diag","name":"semgrep",
                 "results": (data.get("results") or [])[:50]}
          pathlib.Path("/tmp/diag-semgrep.json").write_text(json.dumps(doc, indent=2))
          PY
          OUT="diag-security-gates-semgrep-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-semgrep.json /tmp/$OUT 2>/dev/null || echo '{"error":"no diag"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
      - name: Publish bandit signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="security-bandit-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/ci_merge_json.py /tmp/bandit-report.json /tmp/semgrep-report.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  auth-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run matrix
        env:
          COHORTOS_JWT_SECRET: matrix-test-secret-not-for-prod-32chars
          COHORTOS_FOUNDER_TOKEN: founder-matrix-token
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
        run: |
          set -euo pipefail
          set +e
          pytest tests/test_auth_matrix.py tests/test_security_sweep.py tests/test_rate_limit.py -q --tb=short | tee /tmp/auth-matrix.txt
          echo $? > /tmp/pytest-rc
          set -e
          python scripts/ci_write_pytest_report.py /tmp/auth-matrix.txt /tmp/auth-matrix-signal.json
          # Fail the job if pytest failed
          test "$(cat /tmp/pytest-rc)" = "0"
      - name: Publish auth-matrix signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="security-authmatrix-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/auth-matrix-signal.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT

  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -r requirements.txt 'schemathesis>=4,<5' hypothesis
      - name: Start API
        uses: ./.github/actions/start-api
        with:
          jwt_secret: fuzz-secret-not-for-prod-32charsxx
          founder_token: founder-fuzz
          auth_db: /tmp/fuzz-auth.db
          cloud_db: /tmp/fuzz-cloud.db
      - name: Diag on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci_write_diag.py diag-security-schemathesis || true
          OUT="diag-security-schemathesis-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-security-schemathesis.json /tmp/$OUT 2>/dev/null || echo '{"error":"no diag"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
      - name: Fuzz OpenAPI no 5xx
        run: |
          set -euo pipefail
          schemathesis --version
          schemathesis run --help | head -n 40
          # Seed always writes /tmp/fuzz-auth.json and may write /tmp/fuzz-report.json on failure
          set +e
          python scripts/ci_seed_fuzz_auth.py --base http://127.0.0.1:8741 --out /tmp/fuzz-auth.json
          SEED_RC=$?
          set -e
          echo "seed_exit=$SEED_RC"
          cat /tmp/fuzz-auth.json || true
          if [ "$SEED_RC" != "0" ]; then
            echo "SEED FAILED — report written"
            test -f /tmp/fuzz-report.json || echo '{"error":"seed failed","seed_failed":true,"has_5xx":false}' > /tmp/fuzz-report.json
            cat /tmp/fuzz-report.json
            exit 1
          fi
          TOKEN=$(python -c "import json; print(json.load(open('/tmp/fuzz-auth.json')).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo '{"error":"empty token after seed","seed_failed":true,"has_5xx":false}' > /tmp/fuzz-report.json
            exit 1
          fi
          set +e
          schemathesis run http://127.0.0.1:8741/openapi.json \
            --checks not_a_server_error \
            --max-examples=50 \
            --max-failures=20 \
            --request-timeout=10 \
            -H "Authorization: Bearer ${TOKEN}" \
            2>&1 | tee /tmp/schemathesis.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "schemathesis_exit=$RC"
          head -n 100 /tmp/schemathesis.log || true
          tail -n 50 /tmp/schemathesis.log || true
          python scripts/ci_write_fuzz_report.py /tmp/schemathesis.log /tmp/fuzz-report.json || true
          test -f /tmp/fuzz-report.json || echo '{"error":"report writer failed","has_5xx":false}' > /tmp/fuzz-report.json
          cat /tmp/fuzz-report.json
          if grep -qi "No such option" /tmp/schemathesis.log; then exit 1; fi
          python -c "import json; d=json.load(open('/tmp/fuzz-report.json')); print(d); raise SystemExit(1 if d.get('has_5xx') or d.get('seed_failed') else 0)"
      - name: Publish fuzz signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="security-fuzz-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/fuzz-report.json /tmp/$OUT 2>/dev/null || echo '{"error":"no report"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT
