name: CI Gate

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-dev.txt pyyaml
      - name: Full unit suite (same as unit-full)
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: unit-full-secret-not-for-prod-32
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
        run: |
          set +e
          pytest -q --maxfail=20 -p no:cacheprovider 2>&1 | tee /tmp/unit-full.out
          RC=${PIPESTATUS[0]}
          set -e
          exit $RC
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          CONC=failure
          if [ -f /tmp/unit-full.out ] && grep -qE "[0-9]+ passed" /tmp/unit-full.out && ! grep -qE "[1-9][0-9]* failed" /tmp/unit-full.out; then
            CONC=success
          fi
          # better: use exit code file
          python scripts/ci_publish_status.py ci-gate "$CONC" || true
          python scripts/publish_ci_report.py /tmp/unit-full.out "diag-ci-gate-unit-${{ github.run_id }}.txt" 2>/dev/null || true
          test "$CONC" = "success"
