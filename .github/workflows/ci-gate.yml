name: CI Gate

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-full:
    uses: ./.github/workflows/unit-full.yml
    secrets: inherit

  verify-local-mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-dev.txt pyyaml
      - name: make verify
        run: bash scripts/verify.sh
      - name: dod_check
        run: python scripts/dod_check.py

  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit-full, verify-local-mirrors]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          U="${{ needs.unit-full.result }}"
          V="${{ needs.verify-local-mirrors.result }}"
          echo "unit-full=$U verify=$V"
          CONC=success
          if [ "$U" != "success" ] || [ "$V" != "success" ]; then CONC=failure; fi
          python scripts/ci_publish_status.py ci-gate "$CONC" || true
          python - <<PY
          import json, os
          sha = os.environ.get("GITHUB_SHA","")
          doc = {
            "sha": sha,
            "gates": {
              "unit-full": "$U",
              "verify-local-mirrors": "$V",
            },
            "conclusion": "$CONC",
          }
          open("/tmp/status-sha.json","w").write(json.dumps(doc, indent=2))
          print(json.dumps(doc, indent=2))
          PY
          python scripts/publish_ci_report.py /tmp/status-sha.json "status-${{ github.sha }}.json" || true
          test "$CONC" = "success"
