name: Workflow Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install pyyaml
      - name: Lint workflows
        run: python scripts/lint_workflows.py
      - name: actionlint
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color -shellcheck= 2>&1 | tee /tmp/actionlint.out
          # shellcheck optional; core actionlint must be clean
          if grep -E "error:" /tmp/actionlint.out; then exit 1; fi
      - name: Diag actionlint always
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, pathlib
          out = pathlib.Path("/tmp/actionlint.out")
          doc = {"schema":"cohortos.ci-report/v1","kind":"diag","name":"actionlint",
                 "output": out.read_text(errors="replace") if out.exists() else "missing"}
          pathlib.Path("/tmp/diag-actionlint.json").write_text(json.dumps(doc, indent=2))
          print(doc["output"][:2000])
          PY
          OUT="diag-workflow-lint-actionlint-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-actionlint.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
          cat /tmp/actionlint.out >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
      - name: Bandit summary script unit test
        run: |
          set -euo pipefail
          pip install pytest
          pytest tests/test_workflow_lint.py tests/test_bandit_summary.py -q --tb=short

  api-health-optional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install deps exactly as CI
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Health + start-api env parity
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: health-ci-secret-not-for-prod-xx
          COHORTOS_FOUNDER_TOKEN: founder-health
          COHORTOS_AUTH_DB: /tmp/health-auth.db
          COHORTOS_CLOUD_DB: /tmp/health-cloud.db
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
        run: |
          set -euo pipefail
          pytest tests/test_api_health_optional_deps.py tests/test_start_api_env_parity.py -q --tb=short

  dual-tenant-and-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest httpx psutil hypothesis
      - name: Dual-tenant matrix + scale
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: matrix-secret-not-for-prod-32chars
          COHORTOS_FOUNDER_TOKEN: founder-matrix
          COHORTOS_AUTH_DB: /tmp/matrix-auth.db
          COHORTOS_CLOUD_DB: /tmp/matrix-cloud.db
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
          SCALE_STUDENTS: "5000"
          SCALE_ATTENDANCE: "200000"
          SCALE_FEES: "20000"
        run: |
          set -euo pipefail
          set +e
          pytest tests/test_dual_tenant_matrix.py tests/test_scale_b6.py -q --tb=short 2>&1 | tee /tmp/dual-scale.out
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## dual-tenant-and-scale"
            echo '```'
            tail -n 100 /tmp/dual-scale.out || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          python - <<'PY'
          import json, pathlib, re
          log = pathlib.Path("/tmp/dual-scale.out").read_text(errors="replace")
          failed = re.findall(r"FAILED (\S+)", log)
          doc = {"schema":"cohortos.ci-report/v1","kind":"diag","name":"dual-tenant-scale",
                 "failed_tests": failed, "log_tail": "\n".join(log.splitlines()[-200:]), "rc": 0}
          pathlib.Path("/tmp/diag-dual-scale.json").write_text(json.dumps(doc, indent=2))
          PY
          OUT="diag-workflow-lint-dual-tenant-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cp /tmp/diag-dual-scale.json /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT || true
          exit $RC

  npm-config-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Validate package.json overrides
        run: |
          set -euo pipefail
          pip install pytest -q
          pytest -q tests/test_package_json_overrides.py
