# Playwright desk smoke — login through Support with screenshots.
# Artifacts: screenshots always (short retention); video only on failure.
# PROVEN for GUI-facing work requires this job green + screenshots.
name: E2E Smoke

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "api/**"
      - "services/**"
      - "tests/**"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API (background)
        working-directory: .
        env:
          COHORTOS_JWT_SECRET: e2e-test-secret-not-for-prod
          COHORTOS_FOUNDER_TOKEN: e2e-founder-token-not-for-prod
          COHORTOS_AUTH_DB: /tmp/cohortos-e2e-auth.db
          COHORTOS_CLOUD_DB: /tmp/cohortos-e2e-cloud.db
          COHORTOS_PILOT_OTP: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_STORAGE_ROOT: /tmp/cohortos-storage
          COHORTOS_RAG_DIR: /tmp/cohortos-rag
        run: |
          # api.main has no module-level `app` — use the factory entry
          # (api_entry.py / INTEGRATION_NOTES.md: create_api_app_or_raise --factory)
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8741/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
              echo "API process exited early:"
              cat /tmp/api.log || true
              exit 1
            fi
            sleep 1
          done
          echo "API failed to become healthy:"
          cat /tmp/api.log || true
          exit 1

      - name: Install frontend deps
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install
          # Must use the project-local @playwright/test (in package.json), not a
          # transient npx playwright that leaves @playwright/test unresolved.
          test -d node_modules/@playwright/test || { echo "ERROR: @playwright/test missing after npm install"; exit 1; }
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Serve frontend + run smoke
        env:
          COHORTOS_API_BASE: http://127.0.0.1:8741
          COHORTOS_WEB_BASE: http://127.0.0.1:5173
          CI: "1"
        run: |
          mkdir -p test-results/smoke-shots playwright-report
          # Log OUTSIDE Playwright outputDir (test-results is wiped on run start)
          LOG=/tmp/cohortos-playwright-output.txt
          : > "$LOG"
          npx vite preview --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173 >/dev/null; then
              echo "Frontend up"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5173 >/dev/null || { echo "Frontend never became ready"; exit 1; }
          set +e
          ./node_modules/.bin/playwright test e2e/smoke.spec.ts --reporter=list > "$LOG" 2>&1
          PW_EXIT=$?
          cp "$LOG" test-results/playwright-output.txt 2>/dev/null || true
          echo "===== playwright-output.txt (last 200 lines) ====="
          tail -n 200 "$LOG" || true
          echo "===== end playwright-output.txt ====="
          set -e
          exit $PW_EXIT

      - name: Print playwright log to job console
        if: always()
        run: |
          LOG=/tmp/cohortos-playwright-output.txt
          echo "===== playwright-output.txt (full, always-on) ====="
          if [ -f "$LOG" ]; then
            cat "$LOG"
          elif [ -f test-results/playwright-output.txt ]; then
            cat test-results/playwright-output.txt
          else
            echo "(no playwright log found)"
            ls -la test-results/ 2>/dev/null || true
          fi
          echo "===== end ====="

      - name: Upload playwright text log (always; tiny — survives quota better)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-playwright-log
          path: frontend/test-results/playwright-output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots (always; ignore empty / quota)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-screenshots
          path: |
            frontend/test-results/smoke-shots/
            frontend/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload failure video / trace (failures only; ignore quota)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 5
          if-no-files-found: ignore

      - name: Stop processes
        if: always()
        run: |
          kill $(cat /tmp/api.pid) 2>/dev/null || true
          kill $(cat /tmp/vite.pid) 2>/dev/null || true
