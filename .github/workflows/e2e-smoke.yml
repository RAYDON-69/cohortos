# Playwright desk smoke — login through Support with screenshots.
# Artifacts: screenshots always (short retention); video only on failure.
# PROVEN for GUI-facing work requires this job green + screenshots.
name: E2E Smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20.18.1"

      - name: Install Python deps
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API (background)
        working-directory: .
        env:
          COHORTOS_JWT_SECRET: e2e-test-secret-not-for-prod
          COHORTOS_FOUNDER_TOKEN: e2e-founder-token-not-for-prod
          COHORTOS_AUTH_DB: /tmp/cohortos-e2e-auth.db
          COHORTOS_CLOUD_DB: /tmp/cohortos-e2e-cloud.db
          COHORTOS_PILOT_OTP: "1"
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_STORAGE_ROOT: /tmp/cohortos-storage
          COHORTOS_RAG_DIR: /tmp/cohortos-rag
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
        run: |
          # api.main has no module-level `app` — use the factory entry
          # (api_entry.py / INTEGRATION_NOTES.md: create_api_app_or_raise --factory)
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8741/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
              echo "API process exited early:"
              cat /tmp/api.log || true
              exit 1
            fi
            sleep 1
          done
          echo "API failed to become healthy:"
          cat /tmp/api.log || true
          exit 1

      - name: Install frontend deps
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install
          # Must use the project-local @playwright/test (in package.json), not a
          # transient npx playwright that leaves @playwright/test unresolved.
          test -d node_modules/@playwright/test || { echo "ERROR: @playwright/test missing after npm install"; exit 1; }
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Bundle budget check (linux build)
        working-directory: frontend
        run: |
          npm run build
          cd .. && bash scripts/check_bundle_budget.sh
          echo "### Bundle budget" >> "$GITHUB_STEP_SUMMARY"
          find frontend/dist -name '*.js' -printf '%s %p\n' | sort -n | tail -15 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pre-flight curl frontend + API
        run: |
          echo "### Pre-flight" >> "$GITHUB_STEP_SUMMARY"
          # Frontend may not be up yet — start it briefly for check after serve step;
          # here only API (already running)
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8741/health || echo "000")
          echo "API /health HTTP $code"
          echo "- API /health: \`$code\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error file=api/main.py::API /health returned $code — backend layer failed"
            exit 1
          fi

      - name: Serve frontend + run CORE smoke
        id: core
        env:
          COHORTOS_API_BASE: http://127.0.0.1:8741
          CI: "true"
        run: |
          mkdir -p test-results/smoke-shots playwright-report
          : > /tmp/browser-console.txt
          LOG=/tmp/cohortos-playwright-output.txt
          : > "$LOG"
          npx vite --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 >/dev/null; then
              echo "Frontend up"
              break
            fi
            sleep 1
          done
          fcode=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/ || echo "000")
          echo "Frontend HTTP $fcode"
          echo "- Frontend /: \`$fcode\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fcode" != "200" ] && [ "$fcode" != "304" ]; then
            echo "::error file=frontend::Frontend not ready HTTP $fcode"
            tail -n 40 /tmp/vite.log || true
            exit 1
          fi
          set +e
          ./node_modules/.bin/playwright test e2e/smoke.spec.ts --reporter=list --workers=1 && ./node_modules/.bin/playwright test e2e/smoke-journeys.spec.ts --reporter=list --workers=1 > "$LOG" 2>&1
          PW_EXIT=$?
          cp "$LOG" test-results/playwright-output.txt 2>/dev/null || true
          echo "===== CORE playwright (last 80) ====="
          tail -n 80 "$LOG" || true
          if [ "$PW_EXIT" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=frontend/e2e/smoke.spec.ts::$line"
            done < <(tail -n 80 "$LOG")
            {
              echo "### CORE smoke FAILED"
              echo '```'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CORE smoke passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          set -e
          exit $PW_EXIT


      - name: Axe serious/critical must be zero
        working-directory: frontend
        env:
          COHORTOS_API_BASE: http://127.0.0.1:8741
          COHORTOS_WEB_BASE: http://127.0.0.1:5173
        run: |
          set -uo pipefail
          : > /tmp/axe.out
          echo "pwd=$(pwd)" | tee -a /tmp/axe.out
          ls node_modules/@playwright/test 2>&1 | head -3 | tee -a /tmp/axe.out || true
          if [ ! -f node_modules/axe-core/axe.min.js ]; then
            npm install axe-core --no-save 2>&1 | tee -a /tmp/axe.out || true
          fi
          if [ ! -x ./node_modules/.bin/playwright ]; then
            echo "MISSING playwright binary" | tee -a /tmp/axe.out
            exit 1
          fi
          # Ensure vite still up
          if ! curl -sf http://127.0.0.1:5173 >/dev/null; then
            npx vite --host 127.0.0.1 --port 5173 > /tmp/vite-axe.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          fi
          set +e
          ./node_modules/.bin/playwright test e2e/axe-hard.spec.ts --reporter=list --workers=1 >> /tmp/axe.out 2>&1
          RC=$?
          set -e
          echo "axe_exit=$RC" | tee -a /tmp/axe.out
          {
            echo "## Axe (exit $RC)"
            echo '```'
            tail -n 80 /tmp/axe.out || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit $RC
      - name: Diag axe always
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp
          : > /tmp/axe-diag-extra.json
          python3 - <<'PY'
          import json, pathlib
          axe_out = pathlib.Path("/tmp/axe.out").read_text(errors="replace") if pathlib.Path("/tmp/axe.out").exists() else "(no /tmp/axe.out)"
          viol_path = pathlib.Path("frontend/test-results/axe-violations.json")
          if not viol_path.exists():
              viol_path = pathlib.Path("test-results/axe-violations.json")
          viol = {}
          if viol_path.exists():
              try:
                  viol = json.loads(viol_path.read_text())
              except Exception as e:
                  viol = {"parse_error": str(e), "raw": viol_path.read_text(errors="replace")[:5000]}
          # normalize counts
          rules = {}
          items = viol if isinstance(viol, list) else viol.get("violations") or viol.get("results") or []
          if isinstance(items, list):
              for v in items:
                  rid = v.get("id") or v.get("ruleId") or "unknown"
                  impact = v.get("impact") or ""
                  rules[rid] = rules.get(rid, 0) + 1
          doc = {
              "axe_out_tail": "\n".join(axe_out.splitlines()[-120:]),
              "violations": viol,
              "counts_per_rule": rules,
              "serious_critical": [k for k,v in (viol if isinstance(viol,dict) else {}).items()] if False else rules,
          }
          pathlib.Path("/tmp/axe-diag-extra.json").write_text(json.dumps(doc, indent=2))
          print(json.dumps({"counts_per_rule": rules, "out_len": len(axe_out)}, indent=2))
          PY
          OUT="diag-e2e-smoke-axe-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/publish_diag.py e2e-axe "$OUT" /tmp/axe-diag-extra.json || true
          # never fail this step
          exit 0
      - name: Run EXTENDED smoke (voice/class/broadcast/call-desk)
        if: success()
        id: extended
        env:
          COHORTOS_API_BASE: http://127.0.0.1:8741
          CI: "true"
        run: |
          LOG=/tmp/cohortos-playwright-extended.txt
          set +e
          ./node_modules/.bin/playwright test e2e/smoke-extended.spec.ts e2e/smoke-extended-journeys.spec.ts --reporter=list > "$LOG" 2>&1
          PW_EXIT=$?
          cat "$LOG" >> test-results/playwright-output.txt 2>/dev/null || true
          echo "===== EXTENDED playwright (last 80) ====="
          tail -n 80 "$LOG" || true
          if [ "$PW_EXIT" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=frontend/e2e/smoke-extended.spec.ts::$line"
            done < <(tail -n 80 "$LOG")
            {
              echo "### EXTENDED smoke FAILED"
              echo '```'
              tail -n 80 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### EXTENDED smoke passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          set -e
          exit $PW_EXIT


      - name: Print playwright log to job console
        if: always()
        run: |
          LOG=/tmp/cohortos-playwright-output.txt
          echo "===== playwright-output.txt (full, always-on) ====="
          if [ -f "$LOG" ]; then
            cat "$LOG"
          elif [ -f test-results/playwright-output.txt ]; then
            cat test-results/playwright-output.txt
          else
            echo "(no playwright log found)"
            ls -la test-results/ 2>/dev/null || true
          fi
          echo "===== end ====="


      - name: Warn if extended failed (CORE still green)
        if: steps.extended.outcome == 'failure'
        run: |
          echo "::warning::EXTENDED smoke failed — CORE gate still green. See ci-reports branch for details."
          echo "### EXTENDED failed (workflow continues)" >> "$GITHUB_STEP_SUMMARY"



      - name: Publish definitive e2e signal JSON to ci-reports
        if: always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_ID="${{ github.run_id }}"
          ATTEMPT="${{ github.run_attempt }}"
          OUT="e2e-${RUN_ID}-${ATTEMPT}.json"
          CORE_OUT="${{ steps.core.outcome }}"
          EXT_OUT="${{ steps.extended.outcome }}"
          CORE_LOG=/tmp/cohortos-playwright-output.txt
          EXT_LOG=/tmp/cohortos-playwright-extended.txt
          export RUN_ID ATTEMPT OUT CORE_OUT EXT_OUT
          RUN_ID="$RUN_ID" ATTEMPT="$ATTEMPT" OUT="$OUT" CORE_OUT="$CORE_OUT" EXT_OUT="$EXT_OUT" python3 - <<'PY'
          import json, os, datetime, re, pathlib
          def counts(path):
              p = pathlib.Path(path)
              if not p.exists():
                  return {"passed": 0, "failed": 0, "skipped": 0, "raw_tail": ""}
              text = p.read_text(errors="ignore")
              return {
                  "passed": len(re.findall(r"✓|passed", text)),
                  "failed": len(re.findall(r"✘|failed", text)),
                  "skipped": len(re.findall(r"skipped", text)),
                  "raw_tail": "\n".join(text.splitlines()[-40:]),
              }
          fail_lines = []
          for path in ("/tmp/cohortos-playwright-extended.txt", "/tmp/cohortos-playwright-output.txt"):
              p = pathlib.Path(path)
              if p.exists():
                  for line in p.read_text(errors="ignore").splitlines():
                      if "Error:" in line or "✘" in line:
                          fail_lines.append(line.strip()[:300])
          doc = {
              "sha": os.environ.get("GITHUB_SHA", ""),
              "main_sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("RUN_ID", ""),
              "run_attempt": os.environ.get("ATTEMPT", ""),
              "core_outcome": os.environ.get("CORE_OUT", ""),
              "extended_outcome": os.environ.get("EXT_OUT", ""),
              "core_counts": counts("/tmp/cohortos-playwright-output.txt"),
              "extended_counts": counts("/tmp/cohortos-playwright-extended.txt"),
              "flags": {
                  "COHORTOS_TEST_EXPOSE_OTP": "1",
                  "COHORTOS_SKIP_MODEL_DOWNLOAD": "1",
                  "continue_on_error_extended": False,
              },
              "failing_snippets": fail_lines[:30],
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
          }
          out = os.environ.get("OUT", "e2e-unknown.json")
          pathlib.Path("/tmp").joinpath(out).write_text(json.dumps(doc, indent=2))
          print(json.dumps(doc, indent=2)[:800])
          PY
          python3 - <<'PY'
          import json, pathlib, os, re
          out = pathlib.Path("/tmp") / os.environ.get("OUT", "e2e-unknown.json")
          doc = json.loads(out.read_text()) if out.exists() else {}
          tests = []
          for logp in ("/tmp/cohortos-playwright-output.txt", "/tmp/cohortos-playwright-extended.txt"):
              p = pathlib.Path(logp)
              if not p.exists():
                  continue
              for line in p.read_text(errors="ignore").splitlines():
                  if "e2e/" in line and any(x in line for x in ("✓", "✘", "passed", "failed", "Error")):
                      tests.append(line.strip()[:240])
          doc["per_test_lines"] = tests[:80]
          out.write_text(json.dumps(doc, indent=2))
          print("tests_captured", len(tests))
          PY
          python scripts/publish_ci_report.py "/tmp/$OUT" "$OUT"
          echo "### Signal ci-reports/$OUT core=$CORE_OUT extended=$EXT_OUT" >> "$GITHUB_STEP_SUMMARY"


      - name: Upload playwright text log (always; tiny — survives quota better)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-smoke-playwright-log
          path: frontend/test-results/playwright-output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots (always; ignore empty / quota)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-smoke-screenshots
          path: |
            frontend/test-results/smoke-shots/
            frontend/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload failure video / trace (failures only; ignore quota)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-smoke-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 5
          if-no-files-found: ignore

      - name: Stop processes
        if: always()
        run: |
          kill $(cat /tmp/api.pid) 2>/dev/null || true
          kill $(cat /tmp/vite.pid) 2>/dev/null || true
