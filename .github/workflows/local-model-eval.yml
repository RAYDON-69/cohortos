name: Local Model Eval
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to eval (or both)"
        default: "both"
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Cache local models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/cohortos-models
          key: local-gguf-v1
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install llama-cpp-python==0.3.4 || pip install llama-cpp-python
          pip install psutil
      - name: Run tool-routing eval (console only)
        env:
          COHORTOS_LOCAL_MODEL_DIR: ${{ runner.temp }}/cohortos-models
          COHORTOS_MODEL_CONSENT: "1"
        run: |
          mkdir -p "$COHORTOS_LOCAL_MODEL_DIR"
          python scripts/local_model_eval.py --models both --min-json 0.90 --min-correct 0.70
        # Results print to console — do NOT upload artifacts (quota)
