name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: |
          set +e
          pip install -r requirements.txt
          pip-audit -r requirements.txt --format json -o /tmp/pip-audit.json
          set -e
          python scripts/pip_audit_gate.py --json /tmp/pip-audit.json --allowlist docs/PIP_AUDIT_ALLOWLIST.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - run: npm install --package-lock-only || npm install
      - run: |
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit.json
          RC=$?
          set -e
          # Prefer automated fix for non-breaking
          npm audit fix || true
          if [ "$RC" -ne 0 ]; then
            python ../scripts/npm_audit_gate.py --json /tmp/npm-audit.json || true
            # Re-run after fix
            npm audit --audit-level=high
          fi

  codeql:
    runs-on: ubuntu-latest
    # Skip cleanly until Code scanning is enabled in repo settings (owner action).
    # Gap covered by bandit + semgrep in security-gates.yml.
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3
        with:
          languages: javascript, python
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3

  electron-hardening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - run: |
          node -e "
          const fs=require('fs');
          const main=fs.readFileSync('electron/main.cjs','utf8');
          const checks=[
            [/contextIsolation\s*:\s*true/, 'contextIsolation:true'],
            [/nodeIntegration\s*:\s*false/, 'nodeIntegration:false'],
            [/sandbox\s*:\s*true/, 'sandbox:true'],
          ];
          let fail=false;
          for (const [re,name] of checks) {
            if (!re.test(main)) { console.error('MISSING '+name); fail=true; }
            else console.log('OK '+name);
          }
          if (fail) process.exit(1);
          "
