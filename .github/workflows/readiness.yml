name: Release Readiness

on:
  workflow_run:
    workflows: ["E2E Smoke", "Security and License Gates", "Desktop Package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  chaos-and-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest hypothesis
      - name: Chaos + diagnostics + upgrade unit drills
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: readiness-secret-not-for-prod-xxxx
          COHORTOS_FOUNDER_TOKEN: founder-ready
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          pytest tests/test_chaos_data_safety.py tests/test_diagnostics_bundle.py tests/test_upgrade_migrations.py tests/test_safe_http.py tests/test_chroma_embedded_only.py tests/test_migration_replay.py tests/test_fee_properties.py tests/test_locale_bd.py tests/test_offline_unreliable.py tests/test_subscription_licensing.py tests/test_allowlist_canary.py tests/test_diagnostics_api.py -q --tb=short | tee /tmp/chaos.log
      - name: Start seeded API + real load test
        env:
          COHORTOS_JWT_SECRET: readiness-secret-not-for-prod-xxxx
          COHORTOS_FOUNDER_TOKEN: founder-ready
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
          LOAD_SOAK_S: "60"
          LOAD_MIX_N: "100"
          LOAD_BURST_N: "100"
        run: |
          set -euo pipefail
          nohup python -m uvicorn api.main:create_api_app_or_raise --factory --host 127.0.0.1 --port 8741 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8741/health; then echo "API ready"; break; fi
            sleep 1
            if [ "$i" -eq 60 ]; then echo "API never ready"; cat /tmp/api.log; exit 1; fi
          done
          python scripts/ci_seed_fuzz_auth.py --base http://127.0.0.1:8741 --out /tmp/load-auth.json
          export COHORTOS_LOAD_TOKEN=$(python -c "import json; print(json.load(open('/tmp/load-auth.json')).get('access_token',''))")
          python scripts/load_smoke.py
          test -f /tmp/load-report.json
          python -c "import json; d=json.load(open('/tmp/load-report.json')); print(d); raise SystemExit(0 if d.get('pass') else 1)"
      - name: Poll ci-reports for this SHA (up to 20 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci_wait_for_reports.py --sha "${{ github.event.workflow_run.head_sha || github.sha }}" --minutes 20
      - name: Scorecard (must fail on NO-GO)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci_readiness_scorecard.py
          test -f docs/READINESS.md
          test -f /tmp/readiness.json
          python -c "import json; d=json.load(open('/tmp/readiness.json')); print(d.get('overall')); raise SystemExit(0 if d.get('overall')=='GO' else 1)"
      - name: Publish readiness signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          OUT="readiness-${SHA}.json"
          cp /tmp/readiness.json /tmp/$OUT 2>/dev/null || echo '{"overall":"NO-GO","error":"scorecard missing"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT
