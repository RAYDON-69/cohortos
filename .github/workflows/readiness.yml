name: Release Readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  chaos-and-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install pytest hypothesis
      - name: Chaos + diagnostics + upgrade unit drills
        env:
          COHORTOS_ENV: test
          COHORTOS_JWT_SECRET: readiness-secret-not-for-prod-xxxx
          COHORTOS_FOUNDER_TOKEN: founder-ready
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          pytest tests/test_chaos_data_safety.py tests/test_diagnostics_bundle.py tests/test_upgrade_migrations.py tests/test_safe_http.py tests/test_chroma_embedded_only.py tests/test_migration_replay.py tests/test_fee_properties.py tests/test_locale_bd.py tests/test_offline_unreliable.py tests/test_subscription_licensing.py tests/test_allowlist_canary.py tests/test_diagnostics_api.py -q --tb=short | tee /tmp/chaos.log
      - name: Start seeded API
        uses: ./.github/actions/start-api
        with:
          jwt_secret: readiness-secret-not-for-prod-xxxx
          founder_token: founder-ready
          auth_db: /tmp/ready-auth.db
          cloud_db: /tmp/ready-cloud.db
      - name: Build frontend for bundle measurement
        working-directory: frontend
        run: |
          set -euo pipefail
          bash ../scripts/ci_step.sh npm-ci -- npm ci || npm install
          npm run build
      - name: Real load test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COHORTOS_JWT_SECRET: readiness-secret-not-for-prod-xxxx
          COHORTOS_FOUNDER_TOKEN: founder-ready
          COHORTOS_TEST_EXPOSE_OTP: "1"
          COHORTOS_RATE_LIMIT_DISABLED: "1"
          COHORTOS_SKIP_MODEL_DOWNLOAD: "1"
          COHORTOS_ENV: test
          LOAD_SOAK_S: "60"
          LOAD_MIX_N: "100"
          LOAD_BURST_N: "100"
        run: |
          set -euo pipefail
          python scripts/ci_seed_fuzz_auth.py --base http://127.0.0.1:8741 --out /tmp/load-auth.json
          export COHORTOS_LOAD_TOKEN=$(python -c "import json; print(json.load(open('/tmp/load-auth.json')).get('access_token',''))")
          export COHORTOS_LOAD_TENANT=$(python -c "import json; print(json.load(open('/tmp/load-auth.json')).get('tenant_id',''))")
          echo "load token len=${#COHORTOS_LOAD_TOKEN} tenant=$COHORTOS_LOAD_TENANT"
          set +e
          python scripts/load_smoke.py
          LOAD_RC=$?
          set -e
          test -f /tmp/load-report.json
          python scripts/ci_write_diag.py diag-readiness-load || true
          {
            echo "## Load report"
            echo '```'
            cat /tmp/load-report.json || true
            echo '```'
            echo "## API log tail"
            echo '```'
            tail -n 200 /tmp/api.log || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          OUT="diag-readiness-load-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/publish_diag.py readiness-load "$OUT" /tmp/load-report.json || true
          python -c "import json; d=json.load(open('/tmp/load-report.json')); print(d); raise SystemExit(0 if d.get('pass') else 1)"
          python scripts/ci_emit_aux_reports.py || true
          python3 - <<'PY'
          import json, pathlib
          kinds = {}
          for p in pathlib.Path("/tmp").glob("*-report.json"):
              try:
                  d = json.loads(p.read_text())
                  kinds[p.name] = {"pass": d.get("pass"), "kind": d.get("kind"), "keys": list(d.keys())[:12]}
              except Exception as e:
                  kinds[p.name] = {"error": str(e)}
          print("AUX_REPORTS", json.dumps(kinds, indent=2))
          pathlib.Path("/tmp/aux-kinds.json").write_text(json.dumps(kinds, indent=2))
          PY
          # Publish named reports scorecard expects
          for pair in "load-report.json:load-${{ github.run_id }}-${{ github.run_attempt }}.json" "bundle-report.json:bundle-${{ github.run_id }}-${{ github.run_attempt }}.json" "heap-report.json:heap-${{ github.run_id }}-${{ github.run_attempt }}.json" "health-report.json:health-${{ github.run_id }}-${{ github.run_attempt }}.json" "installer-report.json:installer-${{ github.run_id }}-${{ github.run_attempt }}.json"; do
            src="${pair%%:*}"; dest="${pair##*:}"
            cp /tmp/$src /tmp/$dest 2>/dev/null || echo '{"pass":false}' > /tmp/$dest
            python scripts/publish_ci_report.py /tmp/$dest $dest || true
          done
      - name: Poll ci-reports for this SHA (up to 20 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ci_wait_for_reports.py --sha "${{ github.sha }}" --minutes 25 || true
      - name: Scorecard (must fail on NO-GO)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci_readiness_scorecard.py
          test -f docs/READINESS.md
          test -f /tmp/readiness.json
          python -c "import json; d=json.load(open('/tmp/readiness.json')); print(d.get('overall')); raise SystemExit(0 if d.get('overall')=='GO' else 1)"
      - name: Publish readiness signal
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          OUT="readiness-${SHA}.json"
          cp /tmp/readiness.json /tmp/$OUT 2>/dev/null || echo '{"overall":"NO-GO","error":"scorecard missing"}' > /tmp/$OUT
          python scripts/publish_ci_report.py /tmp/$OUT $OUT
