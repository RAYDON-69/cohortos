# CohortOS desk installers — Windows (nsis + portable), Mac (dmg), Linux (AppImage)
# Runs on GitHub-hosted runners (enough RAM for electron-builder + PyInstaller).
# Do NOT run electron-builder in the 1.2GiB agent sandbox — it will OOM / hang.
#
# Trigger: push tag v* or manual workflow_dispatch.
# Installers are published as GitHub Release assets (tag desktop-latest), NOT
# Actions artifacts — Release assets are outside the Actions storage quota.

name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma list: linux,win,mac (default all)"
        required: false
        default: "linux,win,mac"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            api_out: cohortos-api
            eb_args: --linux AppImage
            asset_glob: |
              frontend/release-desktop/*.AppImage
              frontend/release-desktop/*.AppImage.zsync
          - os: win
            runner: windows-2022
            api_out: cohortos-api.exe
            eb_args: --win nsis portable
            asset_glob: |
              frontend/release-desktop/*.exe
              frontend/release-desktop/*.yml
          - os: mac
            runner: macos-14
            api_out: cohortos-api
            eb_args: --mac dmg
            asset_glob: |
              frontend/release-desktop/*.dmg
              frontend/release-desktop/*.zip
              frontend/release-desktop/*.yml

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
        working-directory: .

      - name: Build cohortos-api binary (this OS)
        run: |
          set -euo pipefail
          pyinstaller cohortos-api.spec --noconfirm --clean
          mkdir -p dist
          # Normalize for electron-builder extraResources: ../dist/cohortos-api
          # Git Bash on Windows treats cohortos-api and cohortos-api.exe as the same path —
          # never cp between those two names.
          if [ -f "dist/cohortos-api.exe" ]; then
            API_BIN="dist/cohortos-api.exe"
          elif [ -f "dist/cohortos-api" ] && [ ! -d "dist/cohortos-api" ]; then
            API_BIN="dist/cohortos-api"
          elif [ -f "dist/cohortos-api/cohortos-api" ]; then
            cp dist/cohortos-api/cohortos-api /tmp/cohortos-api-bin
            rm -rf dist/cohortos-api
            mv /tmp/cohortos-api-bin dist/cohortos-api
            API_BIN="dist/cohortos-api"
          else
            echo "ERROR: PyInstaller output not found under dist/"
            ls -laR dist/ || true
            exit 1
          fi
          if [ ! -f "$API_BIN" ]; then
            echo "ERROR: missing binary at $API_BIN"
            exit 1
          fi
          SIZE=$(wc -c < "$API_BIN" | tr -d ' ')
          echo "API binary ready: $API_BIN ($SIZE bytes)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: binary too small ($SIZE bytes)"
            exit 1
          fi
          if [ "$API_BIN" = "dist/cohortos-api.exe" ]; then
            HDR=$(od -An -tx1 -N 2 dist/cohortos-api.exe | tr -d ' \n')
            echo "PE header bytes: $HDR"
            case "$HDR" in
              *4d*5a*|*4D*5A*) echo "PE MZ header OK" ;;
              *) echo "ERROR: dist/cohortos-api.exe is not a PE executable"; exit 1 ;;
            esac
          fi
          ls -la dist/
        shell: bash

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build renderer
        working-directory: frontend
        run: npm run build

      - name: electron-builder ${{ matrix.os }}
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.eb_args }} --publish never

      - name: List installer outputs
        shell: bash
        run: |
          echo "=== frontend/release-desktop ==="
          ls -la frontend/release-desktop/ || true
          find frontend/release-desktop -type f 2>/dev/null | head -40

      # Publish to GitHub Release assets (NOT Actions artifacts — avoids storage quota).
      # Rolling tag desktop-latest always points at the newest successful package set.
      - name: Publish to GitHub Release (desktop-latest)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: desktop-latest
          name: CohortOS desktop (latest build)
          body: |
            Auto-built installers from commit `${{ github.sha }}` (${{ matrix.os }}).
            Re-run **Desktop release** to refresh all three platforms.

            Download the asset for your OS below.
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ matrix.asset_glob }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When triggered by a version tag (v*), also attach the same files to that release.
      - name: Publish to version tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: ${{ matrix.asset_glob }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
