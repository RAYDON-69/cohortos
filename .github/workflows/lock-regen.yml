name: Lockfile Regen

on:
  workflow_dispatch:
  push:
    branches: [main, master, "phase*"]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/lock-regen.yml"

permissions:
  contents: write

concurrency:
  group: lock-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Regen lockfile
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install -g npm@latest
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts
          npm ls braces chokidar sass --omit=dev --all 2>&1 | tee /tmp/npm-ls.txt | tail -80 || true
      - name: Commit lockfile
        run: |
          set -euo pipefail
          cd frontend
          git config user.name "cohortos-bot"
          git config user.email "bot@cohortos.local"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lock unchanged"
            exit 0
          fi
          git commit -m "chore(frontend): regenerate package-lock.json [skip ci]"
          git push || true
      - name: npm audit high
        working-directory: frontend
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit.json
          ARC=$?
          set -e
          echo "audit_exit=$ARC"
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/npm-audit.txt | tail -40 || true
          head -c 12000 /tmp/npm-audit.json || true
          exit $ARC
