[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortos"
version = "0.10.0"
description = "CohortOS domain services — offline-first coaching centre OS (Modules 1–5 + sync/notification)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CohortOS" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "PyJWT>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "PyJWT>=2.8", "httpx>=0.27"]

[project.scripts]
cohortos-migrate = "scripts.migrate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "services*", "cohortos*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
